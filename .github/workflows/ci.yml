name: CI

on:
  push:
    branches: [main, lucas-dev]
  pull_request:
  workflow_dispatch:

concurrency:
  # Chaveado pelo branch, não pelo ref: com um PR aberto, o mesmo commit dispara
  # `push` (refs/heads/lucas-dev) e `pull_request` (refs/pull/N/merge), que são
  # refs diferentes e não se cancelariam — rodava tudo em dobro.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Um job por app. São 3 package-lock.json independentes (não há workspace na
  # raiz), então o cache do npm aponta para o lock de cada app.
  # ---------------------------------------------------------------------------
  apps:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web-backoffice
            build: true
          - app: web-portal-cliente
            build: true
          - app: mobile-operador
            build: false   # Expo: não tem script build; o alvo aqui é o typecheck
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Instalar dependências
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Typecheck
        working-directory: apps/${{ matrix.app }}
        run: npm run typecheck

      - name: Build
        if: matrix.build
        working-directory: apps/${{ matrix.app }}
        # As vars são lidas em tempo de build. Sem elas o app compila e quebra em
        # runtime com tela branca — valores de placeholder bastam para validar o bundle.
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-de-ci
        run: npm run build

      - name: Conferir que o build não emitiu ao lado dos fontes
        if: matrix.build
        working-directory: apps/${{ matrix.app }}
        # O `tsc -b` já emitiu vite.config.js/.d.ts ao lado do vite.config.ts. Como
        # o Vite resolve o .js antes do .ts, mudanças na config passavam a ser
        # ignoradas silenciosamente. O outDir em tsconfig.node.json corrige isso;
        # este passo é o alarme se a correção for desfeita.
        run: |
          for f in vite.config.js vite.config.d.ts tsconfig.tsbuildinfo; do
            if [ -e "$f" ]; then
              echo "::error::$f foi emitido ao lado do fonte — confira o outDir em tsconfig.node.json"
              exit 1
            fi
          done
          echo "Nenhum artefato do tsc ao lado dos fontes ✓"

      - name: Lint
        # Bloqueante: a base entrou com 0 erros (só avisos). `--if-present`
        # porque o mobile ainda não tem o script.
        working-directory: apps/${{ matrix.app }}
        run: npm run lint --if-present

  # ---------------------------------------------------------------------------
  # Prova que o repositório recria o banco do zero.
  #
  # Existe porque o repo já esteve incapaz disso: o núcleo de auth (profiles,
  # perfis_acesso, permissoes_modulo, o enum module_key, is_admin,
  # has_module_perm e o trigger on_auth_user_created) nunca fora versionado, e a
  # primeira migration já dependia dele.
  # ---------------------------------------------------------------------------
  database:
    name: migrations sobem do zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # Versão fixa, não `latest`: resolver "latest" custa uma chamada à API
          # do GitHub sem autenticação, que estoura o limite de taxa em dia de
          # muitos pushes — e o job morre por um motivo que não tem nada a ver
          # com o banco. Fixar também mantém a CI e a máquina local no mesmo CLI.
          version: 2.114.0

      - name: Subir o stack local e aplicar as migrations
        # `supabase start` aplica todas as migrations em ordem; se qualquer uma
        # falhar, o passo falha. É a prova que não temos localmente (sem Docker).
        run: supabase start

      - name: Reaplicar do zero
        # Segunda prova, agora explicitamente do zero: pega migration que só
        # funciona sobre um banco já existente.
        run: supabase db reset

      - name: Conferir que as migrations reproduzem o schema
        # O CLI manda o progresso ("Applying migration…") para stderr junto do
        # resultado, então "arquivo vazio" não serve de critério — o marcador é
        # a linha final.
        run: |
          supabase db diff --schema public 2>&1 | tee /tmp/diff.txt
          if ! grep -q "No schema changes found" /tmp/diff.txt; then
            echo "::error::O banco recriado difere do que as migrations descrevem (veja o diff acima)"
            exit 1
          fi
          echo "Schema reproduzido pelas migrations, sem diferenças ✓"

      - name: Conferir que os tipos gerados não estão defasados
        # Os tipos vêm do schema; se uma migration muda coluna e ninguém roda
        # ./scripts/gen-types.sh, o `tsc` continua verde contra um schema que já
        # não existe — e o erro só aparece em runtime. Aqui os tipos são gerados
        # do banco recém-recriado e comparados com o que está versionado.
        run: |
          supabase gen types typescript --local --schema public > /tmp/gerado.ts
          # A normalização remove o cabeçalho de aviso e o bloco
          # __InternalSupabase, que traz a versão do PostgREST — ela difere entre
          # o projeto remoto e o stack local, sem o schema ter mudado.
          if ! diff <(python3 scripts/normalizar-tipos.py supabase/types/database.ts) \
                    <(python3 scripts/normalizar-tipos.py /tmp/gerado.ts) > /tmp/tipos.diff; then
            echo "::error::supabase/types/database.ts está defasado. Rode ./scripts/gen-types.sh e commite."
            head -60 /tmp/tipos.diff
            exit 1
          fi
          for app in web-backoffice web-portal-cliente mobile-operador; do
            if ! diff -q supabase/types/database.ts "apps/$app/src/lib/database.types.ts" > /dev/null; then
              echo "::error::apps/$app/src/lib/database.types.ts divergiu do arquivo canônico. Rode ./scripts/gen-types.sh."
              exit 1
            fi
          done
          echo "Tipos em dia ✓"

      - name: Suíte de RLS
        # Único lugar onde dá para provar RLS de verdade: aqui somos superusuário
        # e podemos `set local role authenticated`. O conector de produção roda
        # como supabase_read_only_user e não troca de role.
        # ON_ERROR_STOP porque os testes falham via `raise exception`.
        run: |
          for f in supabase/tests/rls/*.sql; do
            echo "--- $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Parar o stack
        if: always()
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # Drift contra o projeto remoto.
  #
  # Roda só agendado/manual: detecta DDL aplicado pelo dashboard sem migration —
  # que foi exatamente como o drift anterior nasceu. Não roda em PR porque o
  # remoto muda legitimamente entre abrir e integrar, e forks não veem segredos.
  #
  # Requer os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD.
  # Enquanto não existirem, o job é pulado em vez de falhar.
  # ---------------------------------------------------------------------------
  drift:
    name: repositório x projeto remoto
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # Versão fixa, não `latest`: resolver "latest" custa uma chamada à API
          # do GitHub sem autenticação, que estoura o limite de taxa em dia de
          # muitos pushes — e o job morre por um motivo que não tem nada a ver
          # com o banco. Fixar também mantém a CI e a máquina local no mesmo CLI.
          version: 2.114.0

      - name: Comparar migrations locais com as aplicadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Segredos não configurados — pulando a checagem de drift."
            exit 0
          fi
          supabase link --project-ref imnfcffmzzukabhsotul
          supabase migration list --linked
